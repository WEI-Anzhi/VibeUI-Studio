<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeUI Studio · AI 动态生成</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: #0a0a0f;
            color: #e0e0ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid #2a2a4a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }
        header h1 {
            font-size: 1.6rem;
            background: linear-gradient(135deg, #a18cd1, #fbc2eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .input-row {
            padding: 1rem 2rem;
            border-bottom: 1px solid #2a2a4a;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }
        input, button {
            padding: 0.6rem 1rem;
            border-radius: 8px;
            border: 1px solid #2a2a4a;
            background: #1a1a2e;
            color: #e0e0ff;
            font-size: 0.95rem;
        }
        button.primary {
            background: #7b2ff7;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button.primary:hover { filter: brightness(1.2); }
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            padding: 1.5rem;
        }
        @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
        .panel {
            background: #1a1a2e;
            border-radius: 12px;
            border: 1px solid #2a2a4a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel-header {
            padding: 0.8rem 1.2rem;
            border-bottom: 1px solid #2a2a4a;
            font-weight: 600;
            color: #c0b0ff;
        }
        iframe {
            width: 100%; height: 100%; border: none; background: #111;
            min-height: 400px;
        }
        .code-box {
            flex: 1;
            background: #0d0d1a;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
            overflow-y: auto;
            color: #ccc;
            max-height: 400px;
        }
        .status { font-size: 0.9rem; opacity: 0.8; }
    </style>
</head>
<body>
    <header>
        <h1>🎨 VibeUI Studio</h1>
        <span id="statusDisplay" class="status">就绪</span>
    </header>

    <div class="input-row">
        <input type="text" id="styleDesc" placeholder="描述任意风格" value="赛博朋克雨夜霓虹">
        <input type="password" id="apiKey" placeholder="DeepSeek API Key" style="width:200px;">
        <button id="generateBtn" class="primary">✨ AI 生成前端</button>
    </div>

    <main>
        <div class="panel">
            <div class="panel-header">📱 实时预览（可交互）</div>
            <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
        <div class="panel">
            <div class="panel-header">📄 生成的完整 HTML <button id="copyBtn" style="font-size:0.8rem; padding:0.3rem 0.8rem;">复制</button></div>
            <div id="codeDisplay" class="code-box">// 输入风格描述和API Key，点击生成</div>
        </div>
    </main>

    <script>
        const generateBtn = document.getElementById('generateBtn');
        const previewFrame = document.getElementById('previewFrame');
        const codeDisplay = document.getElementById('codeDisplay');
        const statusDisplay = document.getElementById('statusDisplay');

        generateBtn.addEventListener('click', async () => {
            const desc = document.getElementById('styleDesc').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();

            if (!desc || !apiKey) {
                alert('请输入风格描述和API Key');
                return;
            }

            statusDisplay.innerText = '正在调用AI生成...';
            try {
                const response = await fetch('http://localhost:3456/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ apiKey, styleDesc: desc })
                });
                const data = await response.json();
                if (data.code) {
                    codeDisplay.textContent = data.code;
                    // 检查代码是否完整（至少包含闭合标签）
                    if (data.code.includes('</html>') && data.code.includes('<script>')) {
                        previewFrame.srcdoc = data.code;
                        statusDisplay.innerText = '✅ 生成成功';
                    } else {
                        previewFrame.srcdoc = '<html><body style="color:white;padding:2rem;">⚠️ 代码不完整，可复制后手动保存测试</body></html>';
                        statusDisplay.innerText = '⚠️ 代码可能被截断，已尽力渲染';
                    }
                } else {
                    statusDisplay.innerText = '❌ 生成失败: ' + (data.error || '未知错误');
                }
            } catch (e) {
                statusDisplay.innerText = '❌ 连接失败，确认后端已启动';
                console.error(e);
            }
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
            const code = codeDisplay.textContent;
            navigator.clipboard.writeText(code).then(() => alert('已复制'));
        });
    </script>
</body>
</html>
